<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var key = 'slal-theme';
        try {
          var stored = localStorage.getItem(key);
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <script>
      MathJax = {
        tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
        svg: { fontCache: 'global' }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    {% seo %}
  </head>
  <body>
    <div class="bg-accent" aria-hidden="true"></div>
    <header class="site-header">
      <div class="container">
        {% unless page.url == '/' or page.url == '/index.html' %}
          <p class="kicker">Research Brief</p>
        {% endunless %}
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="tagline">{{ site.description }}</p>
      </div>
    </header>

    {% include nav.html %}

    <main class="container prose" id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>An open-source agentic research project, led by <a href="https://topherrasmussen.com">Topher Rasmussen, MSW</a>.</p>
      </div>
    </footer>

    <script>
      // Mobile nav toggle
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.documentElement;
        var themeKey = 'slal-theme';
        var themeToggle = document.querySelector('.theme-toggle');
        var toggle = document.querySelector('.nav-toggle');
        var drawer = document.querySelector('.nav-drawer');
        var overlay = document.querySelector('.nav-overlay');
        var menu = document.querySelector('.nav-menu');

        function getSystemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
          root.setAttribute('data-theme', theme);
          if (themeToggle) {
            var isDark = theme === 'dark';
            themeToggle.setAttribute('aria-pressed', String(isDark));
            themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            themeToggle.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
          }
        }

        var currentTheme = root.getAttribute('data-theme') || getSystemTheme();
        applyTheme(currentTheme);

        if (themeToggle) {
          themeToggle.addEventListener('click', function () {
            var nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
            try {
              localStorage.setItem(themeKey, nextTheme);
            } catch (error) {
              // Ignore storage failures (private browsing, policy restrictions)
            }
          });
        }

        function setMenuOpen(open) {
          if (!toggle || !drawer || !overlay) return;
          toggle.setAttribute('aria-expanded', String(open));
          drawer.classList.toggle('is-open', open);
          overlay.classList.toggle('is-open', open);
          overlay.hidden = !open;
          document.body.classList.toggle('menu-open', open);
        }

        if (toggle && menu && drawer && overlay) {
          toggle.addEventListener('click', function () {
            var expanded = toggle.getAttribute('aria-expanded') === 'true';
            setMenuOpen(!expanded);
          });

          overlay.addEventListener('click', function () {
            setMenuOpen(false);
          });

          menu.addEventListener('click', function (event) {
            if (event.target && event.target.closest('a')) {
              setMenuOpen(false);
            }
          });

          document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
              setMenuOpen(false);
            }
          });
        }
      });
    </script>
  </body>
</html>
